name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tabla
          POSTGRES_PASSWORD: tabla
          POSTGRES_DB: tabla
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabla -d tabla" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tabla:tabla@localhost:5432/tabla
      JWT_ACCESS_SECRET: ci-only-secret-at-least-sixteen-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @qr-menu/shared
      - run: npm run typecheck
      - run: npm run lint
      - name: Feature flag defaults (FEATURE_PAYMENTS must stay off on main)
        run: npm run check:flags
      - run: npm test
      - name: Build the static apps (menu, cms, web)
        run: npm run build -w @qr-menu/menu -w @qr-menu/cms -w @qr-menu/web
      - name: Marketing site output sanity
        run: test -f apps/web/dist/index.html && test -f apps/web/dist/en/index.html && test -f apps/web/dist/sitemap-index.xml

  # The Deploy workflow is the only place the images were built; a Dockerfile or lockfile-trim breakage must fail here.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build otvori-api (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          build-args: APP_VERSION=ci
          cache-from: type=gha,scope=api
      - name: Build otvori-caddy (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.caddy
          push: false
          build-args: APP_VERSION=ci
          cache-from: type=gha,scope=caddy
