name: salveta

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salveta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-salveta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salveta} -d ${POSTGRES_DB:-salveta}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-salveta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salveta}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in deploy/.env}
      APP_URL: https://app.${DOMAIN:-salveta.menu}
      API_URL: https://api.${DOMAIN:-salveta.menu}
      PUBLIC_MENU_BASE_URL: https://{slug}.${DOMAIN:-salveta.menu}
      CORS_ORIGINS: https://${DOMAIN:-salveta.menu}
      MAIL_FROM: ${MAIL_FROM:-salveta <no-reply@salveta.menu>}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      UPLOADS_DIR: /app/apps/api/uploads
    volumes:
      - uploads:/app/apps/api/uploads

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
      args:
        DOMAIN: ${DOMAIN:-salveta.menu}
        PUBLIC_ANALYTICS_SRC: ${PUBLIC_ANALYTICS_SRC:-}
        PUBLIC_ANALYTICS_DOMAIN: ${PUBLIC_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-salveta.menu}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in deploy/.env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
